<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>

  <!-- Left loop: closed ring. -->
  <circle cx="176" cy="256" r="82" fill="none" stroke="#f5f5f7" stroke-width="21"/>

  <!-- Right loop: same ring, broken; a gap on its outer edge stands in for
       being unsubscribed, the loop that used to close on itself doesn't anymore. -->
  <path d="M404.4,294.5 A82,82 0 1,1 404.4,217.5" fill="none" stroke="#f5f5f7" stroke-width="21" stroke-linecap="round"/>

  <!-- Equalizer bars inside the left loop. -->
  <g fill="#fa2d48">
    <rect x="145" y="220" width="16" height="72" rx="8"/>
    <rect x="168" y="196" width="16" height="120" rx="8"/>
    <rect x="191" y="228" width="16" height="56" rx="8"/>
  </g>

  <!-- Equalizer bars inside the right loop (mirrored heights). -->
  <g fill="#fa2d48">
    <rect x="297" y="228" width="16" height="56" rx="8"/>
    <rect x="320" y="196" width="16" height="120" rx="8"/>
    <rect x="343" y="220" width="16" height="72" rx="8"/>
  </g>
</svg>
